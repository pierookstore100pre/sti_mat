<!DOCTYPE html>
<html lang="es">
<body>
    <h1>Prueba de CORS</h1>
    <script>
        fetch("http://localhost:3000/api/v1/programas")
            .then((res) => res.json())
            .then((datos) => console.log("Datos recibidos:", datos))
            .catch((error) => console.error("Solicitud bloqueada:", error));
    </script>
</body>
</html>
